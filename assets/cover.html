<!doctype html><html><head><meta charset="utf-8">
<!-- Devpost cover, 1500x1000 (3:2). Shown at ~333x222 in the gallery: one mascot, few big words. -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=block" rel="stylesheet">
<style>
:root{--bg:#1a1424;--text:#fff4ec;--accent:#ef6a4c;--ink:#2a1215;--imp-skin:#e2483d;--imp-skin-dark:#b8322b;--imp-horn:#f1e2c2;--bubble:#fff4ec}
html,body{margin:0;width:1500px;height:1000px;overflow:hidden}
.frame{position:relative;width:1500px;height:1000px;overflow:hidden;font-family:"Fredoka",system-ui,sans-serif;color:var(--text);
  background:radial-gradient(circle at 30% 60%,rgb(239 106 76 / .38) 0%,rgb(239 106 76 / .10) 32%,transparent 55%),var(--bg)}
.imp{position:absolute;left:70px;bottom:-30px;width:660px;filter:drop-shadow(0 18px 40px rgb(0 0 0 / .45))}
.bubble{position:absolute;left:560px;top:110px;background:var(--bubble);color:var(--ink);font-weight:700;font-size:74px;line-height:1.05;
  padding:34px 46px 38px;border-radius:44px;box-shadow:0 14px 0 rgb(0 0 0 / .25)}
.bubble::after{content:"";position:absolute;left:70px;bottom:-54px;border:30px solid transparent;border-top:44px solid var(--bubble);border-left:10px solid transparent;transform:skewX(28deg)}
.words{position:absolute;right:90px;bottom:120px;text-align:right}
h1{margin:0;font-size:230px;line-height:.9;letter-spacing:-.02em;font-weight:700}
.tag{margin:22px 0 0;font-size:66px;line-height:1.1;font-weight:600}
.tag b{color:var(--accent);font-weight:700}
</style></head><body><div class="frame">
<div class="bubble">Pushed.<br>Stop asking.</div>
<svg class="imp" viewBox="0 0 200 220" role="img" aria-label="Ritnag, a red imp">
  <g stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round">
    <path d="M140 170 C 185 175, 190 130, 172 118" fill="none" stroke="var(--imp-skin-dark)" stroke-width="8" stroke-linecap="round"/>
    <path d="M165 110 L 182 112 L 172 126 Z" fill="var(--imp-skin-dark)"/>
    <path d="M62 62 C 50 30, 40 22, 32 18 C 48 40, 50 60, 58 76 Z" fill="var(--imp-horn)"/>
    <path d="M138 62 C 150 30, 160 22, 168 18 C 152 40, 150 60, 142 76 Z" fill="var(--imp-horn)"/>
    <path d="M42 100 L 18 84 L 46 120 Z" fill="var(--imp-skin-dark)"/>
    <path d="M158 100 L 182 84 L 154 120 Z" fill="var(--imp-skin-dark)"/>
    <ellipse cx="100" cy="182" rx="44" ry="30" fill="var(--imp-skin-dark)"/>
    <circle cx="100" cy="108" r="62" fill="var(--imp-skin)"/>
  </g>
  <path d="M60 82 L 88 92" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 82 L 112 92" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="76" cy="106" rx="12" ry="14" fill="#fff"/><ellipse cx="124" cy="106" rx="12" ry="14" fill="#fff"/>
  <circle cx="80" cy="108" r="6.5" fill="var(--ink)"/><circle cx="128" cy="108" r="6.5" fill="var(--ink)"/>
  <path d="M74 136 Q 100 158, 128 132" fill="none" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
  <path d="M84 140 L 88 149 L 92 142 Z" fill="#fff"/>
</svg>
<div class="words">
  <h1>Ritnag</h1>
  <p class="tag">You answer once.<br><b>It handles the rest.</b></p>
</div>
</div></body></html>
