<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#17131c;--panel:#221c2a;--line:#3a3045;--text:#f1eaf5;--muted:#a397ad;--accent:#ff7a45;--imp-skin:#e2483d;--imp-skin-dark:#b8322b;--imp-horn:#f5e6c8;--imp-ink:#2a1215}
html,body{margin:0;width:1500px;height:1000px;background:radial-gradient(circle at 30% 45%,#2a1f33 0%,var(--bg) 60%);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;color:var(--text);overflow:hidden}
.wrap{display:grid;grid-template-columns:600px 1fr;align-items:center;height:100%;padding:0 90px;box-sizing:border-box;gap:40px}
svg{width:560px;filter:drop-shadow(0 0 40px rgba(255,122,69,.45))}
h1{font-size:132px;margin:0;letter-spacing:-.03em;line-height:1}
.tag{font-size:40px;line-height:1.25;color:var(--text);margin:26px 0 44px;max-width:16ch}
.tag b{color:var(--accent);font-weight:700}
.bubble{background:var(--panel);border:2px solid var(--line);border-left:6px solid var(--accent);border-radius:18px;padding:22px 28px;font-size:30px;line-height:1.3;max-width:640px}
.who{font-size:22px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
</style></head><body><div class="wrap">
<svg viewBox="0 0 200 220"><g><path d="M140 170 C 185 175, 190 130, 172 118" fill="none" stroke="var(--imp-skin-dark)" stroke-width="7" stroke-linecap="round"/><path d="M165 110 L 182 112 L 172 126 Z" fill="var(--imp-skin-dark)"/></g>
<g><path d="M62 62 C 50 30, 40 22, 32 18 C 48 40, 50 60, 58 76 Z" fill="var(--imp-horn)"/><path d="M138 62 C 150 30, 160 22, 168 18 C 152 40, 150 60, 142 76 Z" fill="var(--imp-horn)"/>
<path d="M42 100 L 18 84 L 46 120 Z" fill="var(--imp-skin-dark)"/><path d="M158 100 L 182 84 L 154 120 Z" fill="var(--imp-skin-dark)"/>
<ellipse cx="100" cy="182" rx="44" ry="30" fill="var(--imp-skin-dark)"/><circle cx="100" cy="108" r="62" fill="var(--imp-skin)"/>
<path d="M60 82 L 88 92" stroke="var(--imp-ink)" stroke-width="6" stroke-linecap="round"/><path d="M140 82 L 112 92" stroke="var(--imp-ink)" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="76" cy="106" rx="12" ry="14" fill="#fff"/><ellipse cx="124" cy="106" rx="12" ry="14" fill="#fff"/><circle cx="78" cy="108" r="6" fill="var(--imp-ink)"/><circle cx="126" cy="108" r="6" fill="var(--imp-ink)"/>
<path d="M74 136 Q 100 158, 128 132" fill="none" stroke="var(--imp-ink)" stroke-width="5" stroke-linecap="round"/><path d="M84 140 L 88 148 L 92 142 Z" fill="#fff"/></g></svg>
<div><h1>Ritnag</h1><p class="tag">You answer once. <b>It handles the next interruption.</b></p>
<div class="bubble"><div class="who">Ritnag → Bob, third time</div>Yes, Bob. It's pushed. It was pushed the last two times you asked, too.</div></div>
</div></body></html>
